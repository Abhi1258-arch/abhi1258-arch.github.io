<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<meta name="description" content="Read a paper or the screenplay page by page.">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-root="" data-page="reader">
<a class="skip" href="#doc-pages">Skip to the document</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <header class="page-head" style="padding-bottom:1.5rem">
      <p class="crumbs" id="doc-back"></p>
      <p class="label" id="doc-label">Document</p>
      <h1 id="doc-title" style="font-size:clamp(1.8rem,4.5vw,2.8rem)">Loading…</h1>
      <p class="muted" id="doc-meta" role="status"></p>
    </header>
    <div class="doc-pages" id="doc-pages" aria-label="Document pages"></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/js/reader.js"></script>
</body>
</html>
